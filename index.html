<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local 7-Day Weather Widget</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef8f5;
      --panel: #fbfefd;
      --ink: #172321;
      --text: #172321;
      --muted: #687a76;
      --line: #dbe8e4;
      --accent: #087c83;
      --accent-strong: #045c62;
      --accent-soft: #dff5f2;
      --sun: #f5b94c;
      --coral: #e56b5f;
      --rain: #4c99c9;
      --mist: #a9bab7;
      --shadow: 0 24px 70px rgba(12, 54, 56, 0.16);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 16% 12%, rgba(245, 185, 76, 0.22), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(8, 124, 131, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg), #fbfefd 58%, #e6f4ef);
      color: var(--text);
    }

    .weather-shell {
      width: min(1040px, 100%);
    }

    .widget {
      overflow: hidden;
      border: 1px solid rgba(8, 124, 131, 0.14);
      border-radius: 8px;
      background: rgba(251, 254, 253, 0.95);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #f7fcfa);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.55rem, 2vw, 2rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle,
    .meta,
    .small {
      margin: 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button,
    input {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }

    button {
      cursor: pointer;
      padding: 0 14px;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), #0f9aa0);
      color: #fff;
      font-weight: 700;
      transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    button:hover,
    button:focus-visible {
      background: var(--accent-strong);
      box-shadow: 0 8px 20px rgba(11, 127, 134, 0.22);
      transform: translateY(-1px);
      outline: none;
    }

    button.secondary {
      background: #fff;
      color: var(--accent-strong);
      border-color: var(--line);
    }

    input {
      min-width: min(260px, 100%);
      padding: 0 12px;
      color: var(--text);
      background: #fff;
      box-shadow: inset 0 1px 0 rgba(23, 35, 33, 0.03);
    }

    input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(11, 127, 134, 0.14);
    }

    .main {
      display: grid;
      grid-template-columns: minmax(250px, 0.8fr) minmax(0, 1.4fr);
      gap: 0;
    }

    .current {
      display: grid;
      align-content: center;
      min-height: 420px;
      padding: 28px;
      background:
        radial-gradient(circle at 76% 18%, rgba(245, 185, 76, 0.45), transparent 26%),
        linear-gradient(155deg, #064e53 0%, #087c83 48%, #dff5f2 100%);
      border-right: 1px solid var(--line);
      color: #fff;
    }

    .current-weather {
      display: grid;
      gap: 22px;
    }

    .current-hero {
      display: grid;
      gap: 20px;
    }

    .weather-art {
      display: block;
      overflow: visible;
    }

    .weather-art-large {
      width: min(260px, 78vw);
      height: auto;
      filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.18));
    }

    .weather-art-small {
      width: 86px;
      height: 66px;
      margin: 2px 0;
      padding: 4px;
      border: 1px solid rgba(8, 124, 131, 0.08);
      border-radius: 8px;
      background:
        radial-gradient(circle at 72% 24%, rgba(245, 185, 76, 0.18), transparent 30%),
        linear-gradient(145deg, #f7fcfb, #eaf6f3);
    }

    .temperature {
      display: flex;
      align-items: start;
      gap: 5px;
      font-size: clamp(3.4rem, 8vw, 5.6rem);
      line-height: 0.85;
      font-weight: 800;
      letter-spacing: 0;
    }

    .temperature span {
      margin-top: 8px;
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.72);
    }

    .condition {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .current .small {
      color: rgba(255, 255, 255, 0.74);
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .detail {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
    }

    .detail b {
      display: block;
      margin-top: 3px;
      font-size: 1.05rem;
    }

    .forecast {
      padding: 22px;
      background:
        linear-gradient(180deg, #fbfefd, #f4faf7);
    }

    .forecast-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .forecast-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 10px;
    }

    .day-card {
      display: grid;
      gap: 12px;
      min-height: 248px;
      padding: 14px;
      border: 1px solid rgba(8, 124, 131, 0.12);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 252, 250, 0.96)),
        var(--panel);
      box-shadow: 0 10px 26px rgba(23, 35, 33, 0.07);
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .day-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(23, 35, 33, 0.1);
    }

    .day-name {
      font-weight: 800;
    }

    .date {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .weather-caption {
      min-height: 2.5em;
    }

    .temps {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .temps span {
      color: var(--muted);
      font-weight: 700;
    }

    .metrics {
      display: grid;
      gap: 5px;
      margin-top: auto;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .metric-pill {
      display: inline-flex;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      background: #edf8f5;
      color: var(--accent-strong);
      font-weight: 700;
    }

    .status {
      display: none;
      margin: 0;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff6df;
      color: #684500;
    }

    .status.show {
      display: block;
    }

    .results {
      display: none;
      border-bottom: 1px solid var(--line);
      background: #f8fcfb;
      padding: 10px 24px;
    }

    .results.show {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .result-button {
      height: auto;
      min-height: 34px;
      padding: 7px 10px;
      background: #fff;
      color: var(--accent-strong);
      font-size: 0.92rem;
    }

    .empty-state {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .art-sun { fill: var(--sun); }
    .art-coral { fill: var(--coral); }
    .art-cloud { fill: #f7fbfb; }
    .art-cloud-shade { fill: #dbe8e4; }
    .art-rain { stroke: var(--rain); }
    .art-mist { stroke: var(--mist); }
    .art-lightning { fill: #ffd057; }
    .art-snow { stroke: #77b8d6; }

    .day-card .art-cloud { fill: #eef7f5; }
    .day-card .art-cloud-shade { fill: #c8d9d5; }
    .day-card .art-rain { stroke: #2f8fbd; }
    .day-card .art-mist { stroke: #879a96; }
    .day-card .art-snow { stroke: #4f9bc0; }

    @media (max-width: 900px) {
      .topbar,
      .main {
        grid-template-columns: 1fr;
      }

      .controls {
        justify-content: stretch;
      }

      .controls > * {
        flex: 1 1 180px;
      }

      .current {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .current-hero {
        grid-template-columns: minmax(150px, 0.8fr) 1fr;
        align-items: center;
      }

      .cards {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .topbar,
      .current,
      .forecast {
        padding: 18px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .current-hero {
        grid-template-columns: 1fr;
      }

      .weather-art-large {
        width: min(230px, 78vw);
      }
    }
  </style>
</head>
<body>
  <main class="weather-shell">
    <section class="widget" aria-label="Local 7-day weather forecast">
      <div class="topbar">
        <div>
          <h1>Local Weather</h1>
          <p class="subtitle" id="placeLabel">Use your location or search for a town or city.</p>
        </div>
        <div class="controls" aria-label="Forecast controls">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search city or town">
          <button class="secondary" id="searchButton" type="button">Search</button>
          <button id="locationButton" type="button">Use my location</button>
        </div>
      </div>

      <p class="status" id="status" role="status"></p>
      <div class="results" id="results" aria-label="Search results"></div>

      <div class="main">
        <aside class="current" aria-label="Current weather">
          <div class="current-weather" id="currentWeather">
            <div class="empty-state">Your local forecast will appear here.</div>
          </div>
        </aside>

        <section class="forecast" aria-label="Daily forecast">
          <div class="forecast-head">
            <h2>Next 7 Days</h2>
            <p class="meta" id="updatedLabel"></p>
          </div>
          <div class="cards" id="forecastCards">
            <div class="empty-state">Waiting for location...</div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const forecastUrl = "https://api.open-meteo.com/v1/forecast";
    const geocodingUrl = "https://geocoding-api.open-meteo.com/v1/search";

    const statusEl = document.querySelector("#status");
    const placeLabel = document.querySelector("#placeLabel");
    const updatedLabel = document.querySelector("#updatedLabel");
    const currentWeather = document.querySelector("#currentWeather");
    const forecastCards = document.querySelector("#forecastCards");
    const searchInput = document.querySelector("#searchInput");
    const searchButton = document.querySelector("#searchButton");
    const locationButton = document.querySelector("#locationButton");
    const resultsEl = document.querySelector("#results");

    const weatherCodes = {
      0: ["Clear", "Clear sky", "clear"],
      1: ["Sun", "Mainly clear", "clear"],
      2: ["Part", "Partly cloudy", "partly"],
      3: ["Cloud", "Overcast", "cloud"],
      45: ["Fog", "Fog", "fog"],
      48: ["Fog", "Depositing rime fog", "fog"],
      51: ["Drizzle", "Light drizzle", "rain"],
      53: ["Drizzle", "Moderate drizzle", "rain"],
      55: ["Drizzle", "Dense drizzle", "rain"],
      56: ["Ice", "Light freezing drizzle", "snow"],
      57: ["Ice", "Dense freezing drizzle", "snow"],
      61: ["Rain", "Slight rain", "rain"],
      63: ["Rain", "Moderate rain", "rain"],
      65: ["Rain", "Heavy rain", "rain"],
      66: ["Ice", "Light freezing rain", "snow"],
      67: ["Ice", "Heavy freezing rain", "snow"],
      71: ["Snow", "Slight snow", "snow"],
      73: ["Snow", "Moderate snow", "snow"],
      75: ["Snow", "Heavy snow", "snow"],
      77: ["Snow", "Snow grains", "snow"],
      80: ["Showers", "Slight showers", "rain"],
      81: ["Showers", "Moderate showers", "rain"],
      82: ["Showers", "Violent showers", "rain"],
      85: ["Snow", "Slight snow showers", "snow"],
      86: ["Snow", "Heavy snow showers", "snow"],
      95: ["Storm", "Thunderstorm", "storm"],
      96: ["Storm", "Thunderstorm with hail", "storm"],
      99: ["Storm", "Thunderstorm with heavy hail", "storm"]
    };

    function weatherFor(code) {
      return weatherCodes[code] || ["Weather", "Weather unavailable", "cloud"];
    }

    function weatherArt(kind, label, size = "small") {
      const title = label.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
      const viewBox = size === "large" ? "0 0 260 190" : "0 0 120 90";
      const scale = size === "large" ? 1 : 0.46;
      const large = (content) => `
        <svg class="weather-art weather-art-${size}" viewBox="${viewBox}" role="img" aria-label="${title}">
          <title>${title}</title>
          <g transform="scale(${scale})">${content}</g>
        </svg>
      `;

      const sun = `
        <circle class="art-sun" cx="95" cy="78" r="42"/>
        <g stroke="#f5b94c" stroke-width="10" stroke-linecap="round" opacity="0.72">
          <path d="M95 15V2"/><path d="M95 154v-13"/><path d="M32 78H19"/><path d="M171 78h-13"/>
          <path d="M50 33l-9-9"/><path d="M140 123l9 9"/><path d="M50 123l-9 9"/><path d="M140 33l9-9"/>
        </g>
      `;
      const cloud = `
        <path class="art-cloud-shade" d="M66 128h104c23 0 42-18 42-41s-18-40-40-40c-8 0-15 2-21 6-10-22-32-37-57-37-33 0-60 25-63 57-22 4-38 22-38 44 0 6 5 11 11 11h62z" opacity="0.68"/>
        <path class="art-cloud" d="M55 138h112c24 0 43-18 43-41 0-22-18-40-40-40-9 0-17 3-24 7-10-22-32-38-58-38-34 0-62 26-65 59-23 3-41 23-41 46 0 4 3 7 7 7h66z"/>
      `;
      const rain = `
        <g stroke-width="9" stroke-linecap="round" fill="none">
          <path class="art-rain" d="M72 148l-15 26"/><path class="art-rain" d="M118 148l-15 26"/><path class="art-rain" d="M164 148l-15 26"/>
        </g>
      `;
      const snow = `
        <g class="art-snow" stroke-width="6" stroke-linecap="round">
          <path d="M70 154v24"/><path d="M58 166h24"/><path d="M62 158l17 17"/><path d="M79 158l-17 17"/>
          <path d="M135 154v24"/><path d="M123 166h24"/><path d="M127 158l17 17"/><path d="M144 158l-17 17"/>
        </g>
      `;
      const fog = `
        <g class="art-mist" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M34 139h154"/><path d="M18 163h166"/><path d="M54 187h110"/>
        </g>
      `;
      const lightning = `<path class="art-lightning" d="M114 126h29l-25 58 58-73h-32l17-42-47 57z"/>`;

      const art = {
        clear: `${sun}`,
        partly: `${sun}<g transform="translate(28 28) scale(0.82)">${cloud}</g>`,
        cloud,
        rain: `${cloud}${rain}`,
        storm: `${cloud}${lightning}${rain}`,
        snow: `${cloud}${snow}`,
        fog: `${cloud}${fog}`
      };

      return large(art[kind] || art.cloud);
    }

    function showStatus(message, isWarning = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("show", Boolean(message));
      statusEl.style.background = isWarning ? "#fff4e0" : "#e9fbfa";
      statusEl.style.color = isWarning ? "#5e3b00" : "#075f65";
    }

    function formatTemp(value) {
      return Math.round(value);
    }

    function formatDate(dateString, timezone, options) {
      return new Intl.DateTimeFormat(undefined, {
        timeZone: timezone,
        ...options
      }).format(new Date(`${dateString}T12:00:00`));
    }

    function placeFromCoords(latitude, longitude) {
      const lat = Math.abs(latitude).toFixed(2);
      const lon = Math.abs(longitude).toFixed(2);
      return `Local forecast near ${lat}${latitude >= 0 ? "N" : "S"}, ${lon}${longitude >= 0 ? "E" : "W"}`;
    }

    async function loadForecast({ latitude, longitude, label }) {
      showStatus("Loading your 7-day forecast...");
      resultsEl.classList.remove("show");
      resultsEl.innerHTML = "";

      const params = new URLSearchParams({
        latitude,
        longitude,
        current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,uv_index_max",
        temperature_unit: "celsius",
        wind_speed_unit: "kmh",
        precipitation_unit: "mm",
        timezone: "auto",
        forecast_days: "7"
      });

      const response = await fetch(`${forecastUrl}?${params}`);
      if (!response.ok) {
        throw new Error("The weather service could not return a forecast.");
      }

      const data = await response.json();
      renderForecast(data, label || placeFromCoords(Number(latitude), Number(longitude)));
      showStatus("");
    }

    function renderForecast(data, label) {
      const timezone = data.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const currentCode = weatherFor(data.current.weather_code);
      const currentKind = currentCode[2];
      const nowLabel = new Intl.DateTimeFormat(undefined, {
        timeZone: timezone,
        hour: "numeric",
        minute: "2-digit",
        weekday: "short"
      }).format(new Date(data.current.time));

      placeLabel.textContent = label;
      updatedLabel.textContent = `Updated ${nowLabel}`;

      currentWeather.innerHTML = `
        <div class="current-hero">
          ${weatherArt(currentKind, currentCode[1], "large")}
          <div class="current-copy">
            <div class="temperature">${formatTemp(data.current.temperature_2m)}<span>&deg;C</span></div>
            <p class="condition">${currentCode[1]}</p>
            <p class="small">Feels like ${formatTemp(data.current.apparent_temperature)}&deg;C</p>
          </div>
        </div>
        <div class="details">
          <div class="detail"><span class="small">Humidity</span><b>${data.current.relative_humidity_2m}%</b></div>
          <div class="detail"><span class="small">Wind</span><b>${Math.round(data.current.wind_speed_10m)} km/h</b></div>
        </div>
      `;

      forecastCards.innerHTML = data.daily.time.map((date, index) => {
        const code = weatherFor(data.daily.weather_code[index]);
        const kind = code[2];
        const high = formatTemp(data.daily.temperature_2m_max[index]);
        const low = formatTemp(data.daily.temperature_2m_min[index]);
        const rain = data.daily.precipitation_probability_max[index] ?? 0;
        const wind = Math.round(data.daily.wind_speed_10m_max[index] ?? 0);
        const uv = Math.round(data.daily.uv_index_max[index] ?? 0);

        return `
          <article class="day-card kind-${kind}">
            <div>
              <div class="day-name">${formatDate(date, timezone, { weekday: "short" })}</div>
              <div class="date">${formatDate(date, timezone, { month: "short", day: "numeric" })}</div>
            </div>
            ${weatherArt(kind, code[1])}
            <div>
              <div class="temps">${high}&deg; <span>/ ${low}&deg;</span></div>
              <div class="small weather-caption">${code[1]}</div>
            </div>
            <div class="metrics">
              <span class="metric-pill">Rain ${rain}%</span>
              <span>Wind ${wind} km/h</span>
              <span>UV ${uv}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    async function searchPlaces() {
      const query = searchInput.value.trim();
      if (!query) {
        showStatus("Type a city or town to search.", true);
        return;
      }

      showStatus("Searching places...");
      const params = new URLSearchParams({
        name: query,
        count: "5",
        language: "en",
        format: "json"
      });

      const response = await fetch(`${geocodingUrl}?${params}`);
      if (!response.ok) {
        throw new Error("The place search service is unavailable.");
      }

      const data = await response.json();
      const results = data.results || [];
      if (!results.length) {
        showStatus(`No places found for "${query}". Try a nearby city.`, true);
        resultsEl.classList.remove("show");
        return;
      }

      resultsEl.innerHTML = results.map((place, index) => {
        const region = [place.admin1, place.country].filter(Boolean).join(", ");
        return `<button class="result-button" type="button" data-index="${index}">${place.name}${region ? `, ${region}` : ""}</button>`;
      }).join("");
      resultsEl.classList.add("show");
      showStatus("Choose the best match.");

      resultsEl.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          const place = results[Number(button.dataset.index)];
          const region = [place.admin1, place.country].filter(Boolean).join(", ");
          loadForecast({
            latitude: place.latitude,
            longitude: place.longitude,
            label: `${place.name}${region ? `, ${region}` : ""}`
          }).catch(handleError);
        });
      });
    }

    function useBrowserLocation() {
      if (!("geolocation" in navigator)) {
        showStatus("Your browser does not support location lookup. Search for your town or city instead.", true);
        return;
      }

      showStatus("Asking your browser for local location permission...");
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          loadForecast({ latitude, longitude }).catch(handleError);
        },
        () => {
          showStatus("Location permission was blocked or unavailable. Search for your town or city instead.", true);
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 20 * 60 * 1000
        }
      );
    }

    function handleError(error) {
      showStatus(error.message || "Something went wrong while loading the forecast.", true);
      currentWeather.innerHTML = `<div class="empty-state">Forecast unavailable right now.</div>`;
      forecastCards.innerHTML = `<div class="empty-state">Try again or search for a nearby town.</div>`;
    }

    searchButton.addEventListener("click", () => searchPlaces().catch(handleError));
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        searchPlaces().catch(handleError);
      }
    });
    locationButton.addEventListener("click", useBrowserLocation);

    useBrowserLocation();
  </script>
</body>
</html>
